name: Build installable packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none
      - name: Check booking wizard JavaScript syntax
        run: node --check wp-content/plugins/mtn-cafe-booking/assets/booking-wizard.js
      - name: Check SMS OTP JavaScript syntax
        run: node --check wp-content/plugins/mtn-cafe-booking/assets/otp-login.js
      - name: Check settings wizard JavaScript syntax
        run: node --check wp-content/plugins/mtn-cafe-booking/assets/settings-wizard.js
      - name: Check theme shell JavaScript syntax
        run: node --check wp-content/themes/mtn-cafe-theme/assets/app-shell.js
      - name: Run static source-contract checks
        run: php tests/static-contracts.php
      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find wp-content -type f -name '*.php' -print0)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do php -l "$file"; done
      - name: Create installable ZIP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wp-content/plugins
          zip -qr ../../dist/mtn-cafe-booking.zip mtn-cafe-booking
          cd ../themes
          zip -qr ../../dist/mtn-cafe-theme.zip mtn-cafe-theme
          cd ../..
          test -s dist/mtn-cafe-booking.zip
          test -s dist/mtn-cafe-theme.zip
          unzip -t dist/mtn-cafe-booking.zip
          unzip -t dist/mtn-cafe-theme.zip
          test "$(unzip -Z1 dist/mtn-cafe-booking.zip | sed -n '1p')" = "mtn-cafe-booking/"
          test "$(unzip -Z1 dist/mtn-cafe-theme.zip | sed -n '1p')" = "mtn-cafe-theme/"
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtn-wordpress-packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
