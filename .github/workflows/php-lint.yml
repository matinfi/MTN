name: PHP lint

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none
      - name: Check booking wizard JavaScript syntax
        run: node --check wp-content/plugins/mtn-cafe-booking/assets/booking-wizard.js
      - name: Check SMS OTP JavaScript syntax
        run: node --check wp-content/plugins/mtn-cafe-booking/assets/otp-login.js
      - name: Check event discovery JavaScript syntax
        run: node --check wp-content/plugins/mtn-cafe-booking/assets/event-discovery.js
      - name: Run static source-contract checks
        run: php tests/static-contracts.php
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find wp-content -type f -name '*.php' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found"
            exit 1
          fi
          for file in "${files[@]}"; do php -l "$file"; done
