name: WordPress integration tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  wordpress-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [mysql:8.0, mariadb:10.11]
    services:
      db:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: phpunit:9.6
      - name: Install WordPress test library
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/scaffold-command/main/templates/install-wp-tests.sh -o /tmp/install-wp-tests.sh
          bash /tmp/install-wp-tests.sh wordpress_test root password 127.0.0.1 latest true
      - name: Package and install plugin/theme into clean WordPress test core
        run: |
          set -euo pipefail
          mkdir -p /tmp/wordpress/wp-content/plugins /tmp/wordpress/wp-content/themes
          cd wp-content/plugins
          zip -qr /tmp/mtn-cafe-booking.zip mtn-cafe-booking
          cd ../themes
          zip -qr /tmp/mtn-cafe-theme.zip mtn-cafe-theme
          unzip -q /tmp/mtn-cafe-booking.zip -d /tmp/wordpress/wp-content/plugins
          unzip -q /tmp/mtn-cafe-theme.zip -d /tmp/wordpress/wp-content/themes
          test -f /tmp/wordpress/wp-content/plugins/mtn-cafe-booking/mtn-cafe-booking.php
          test -f /tmp/wordpress/wp-content/themes/mtn-cafe-theme/style.css
      - name: Run integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          MTN_PLUGIN_PATH: /tmp/wordpress/wp-content/plugins/mtn-cafe-booking/mtn-cafe-booking.php
        run: phpunit -c phpunit.xml.dist
      - name: Verify database backup and restore
        env:
          DB_NAME: wordpress_test
          DB_USER: root
          DB_PASSWORD: password
          DB_HOST: 127.0.0.1
        run: |
          set -euo pipefail
          table_counts() {
            local database="$1"
            while IFS= read -r table; do
              count=$(mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$database" -Nse "SELECT COUNT(*) FROM \`$table\`")
              printf '%s:%s\n' "$table" "$count"
            done < <(mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$database" -Nse "SHOW TABLES" | sort)
          }
          mysqldump --single-transaction --skip-lock-tables -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" > /tmp/mtn-db-backup.sql
          mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" -e "CREATE DATABASE wordpress_restore_test"
          mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" wordpress_restore_test < /tmp/mtn-db-backup.sql
          table_counts "$DB_NAME" > /tmp/source-table-counts.txt
          table_counts wordpress_restore_test > /tmp/restored-table-counts.txt
          diff -u /tmp/source-table-counts.txt /tmp/restored-table-counts.txt
